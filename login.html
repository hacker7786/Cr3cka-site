<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CR3CKA // Secure Login</title>

    <meta
        name="description"
        content="CR3CKA Security — Secure authentication gateway."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #00ff88;
            --green2: #00d97a;
            --cyan: #00eaff;
            --red: #ff315a;
            --yellow: #ffe600;
            --bg: #030609;
            --panel: rgba(5, 14, 18, 0.82);
            --border: rgba(0, 255, 136, 0.20);
            --text: #d9fff0;
            --muted: #78958b;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 255, 136, 0.09),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 234, 255, 0.08),
                    transparent 30%
                ),
                #030609;

            color: var(--text);
            font-family: "Rajdhani", sans-serif;
        }

        /* ==============================
           BACKGROUND GRID
        ============================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -5;

            background-image:
                linear-gradient(
                    rgba(0, 255, 136, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 255, 136, 0.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 20;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.018) 0px,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px,
                    transparent 4px
                );

            opacity: 0.35;
        }

        .glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.10;
        }

        .glow-one {
            top: -160px;
            left: -120px;
            background: var(--green);
        }

        .glow-two {
            bottom: -180px;
            right: -120px;
            background: var(--cyan);
        }

        /* ==============================
           NAVBAR
        ============================== */

        nav {
            height: 72px;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            border-bottom: 1px solid rgba(0, 255, 136, 0.12);

            background: rgba(2, 6, 8, 0.75);
            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            text-decoration: none;
            color: white;

            font-family: "Orbitron", sans-serif;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border: 1px solid var(--green);
            color: var(--green);

            font-family: "Orbitron", sans-serif;
            font-size: 12px;

            box-shadow:
                0 0 15px rgba(0,255,136,0.25),
                inset 0 0 12px rgba(0,255,136,0.08);

            transform: skew(-8deg);
        }

        .brand span {
            color: var(--green);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 9px;

            color: var(--muted);
            font-size: 13px;
            letter-spacing: 1.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;

            background: var(--green);

            box-shadow: 0 0 12px var(--green);

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* ==============================
           MAIN
        ============================== */

        main {
            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;
        }

        .login-wrapper {
            width: min(460px, 100%);
        }

        .terminal-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            margin-bottom: 16px;

            color: var(--green);

            font-family: monospace;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .terminal-line::before,
        .terminal-line::after {
            content: "";
            height: 1px;
            width: 55px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--green)
            );
        }

        .terminal-line::after {
            background: linear-gradient(
                90deg,
                var(--green),
                transparent
            );
        }

        .title {
            text-align: center;

            font-family: "Orbitron", sans-serif;
            font-size: clamp(30px, 7vw, 52px);
            font-weight: 800;

            letter-spacing: 5px;

            color: #ffffff;

            text-shadow:
                0 0 12px rgba(0,255,136,0.35),
                0 0 30px rgba(0,255,136,0.12);
        }

        .title span {
            color: var(--green);
        }

        .subtitle {
            margin-top: 10px;

            text-align: center;

            color: var(--muted);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* ==============================
           LOGIN CARD
        ============================== */

        .login-card {
            position: relative;

            margin-top: 30px;
            padding: 32px;

            background: var(--panel);

            border: 1px solid var(--border);

            backdrop-filter: blur(20px);

            box-shadow:
                0 0 50px rgba(0,255,136,0.07),
                inset 0 0 30px rgba(0,255,136,0.015);

            clip-path: polygon(
                0 0,
                calc(100% - 18px) 0,
                100% 18px,
                100% 100%,
                18px 100%,
                0 calc(100% - 18px)
            );
        }

        .login-card::before {
            content: "";

            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;

            height: 1px;

            background: var(--green);

            box-shadow: 0 0 18px var(--green);
        }

        .security-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
            padding: 10px 12px;

            border: 1px solid rgba(0,255,136,0.12);

            background: rgba(0,255,136,0.025);

            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
        }

        .security-banner strong {
            color: var(--green);
        }

        .security-code {
            color: var(--cyan);
        }

        /* ==============================
           GOOGLE
        ============================== */

        .google-btn {
            width: 100%;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            border: 1px solid rgba(255,255,255,0.16);

            background: rgba(255,255,255,0.035);
            color: white;

            cursor: pointer;

            font-family: "Rajdhani", sans-serif;
            font-size: 16px;
            font-weight: 700;

            letter-spacing: 1px;

            transition: 0.25s ease;
        }

        .google-btn:hover {
            border-color: rgba(0,234,255,0.5);

            background: rgba(0,234,255,0.06);

            box-shadow:
                0 0 22px rgba(0,234,255,0.08);

            transform: translateY(-1px);
        }

        .google-icon {
            width: 21px;
            height: 21px;

            border-radius: 50%;

            display: grid;
            place-items: center;

            background: white;
            color: #111;

            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 25px 0;

            color: #506a61;

            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;

            height: 1px;

            background: rgba(0,255,136,0.12);
        }

        /* ==============================
           INPUTS
        ============================== */

        .field {
            margin-bottom: 19px;
        }

        .field-label {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #8eaea3;

            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
        }

        .field-label span {
            color: var(--green);
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--green);

            font-family: monospace;
            font-size: 13px;

            pointer-events: none;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 46px;

            outline: none;

            border: 1px solid rgba(0,255,136,0.15);

            background: rgba(0,0,0,0.35);

            color: #eafff7;

            font-family: "Rajdhani", sans-serif;
            font-size: 16px;

            transition: 0.25s ease;
        }

        input::placeholder {
            color: #425b53;
        }

        input:focus {
            border-color: var(--green);

            box-shadow:
                0 0 0 1px rgba(0,255,136,0.08),
                0 0 18px rgba(0,255,136,0.08);
        }

        .password-toggle {
            position: absolute;
            right: 13px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #628177;

            cursor: pointer;

            font-family: monospace;
            font-size: 10px;

            transition: 0.2s;
        }

        .password-toggle:hover {
            color: var(--green);
        }

        /* ==============================
           OPTIONS
        ============================== */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 4px 0 22px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #77948b;

            cursor: pointer;
        }

        .remember input {
            width: 14px;
            height: 14px;

            accent-color: var(--green);
        }

        .forgot {
            color: var(--cyan);
            text-decoration: none;

            transition: 0.2s;
        }

        .forgot:hover {
            color: white;
            text-shadow: 0 0 10px var(--cyan);
        }

        /* ==============================
           LOGIN BUTTON
        ============================== */

        .login-btn {
            position: relative;

            width: 100%;
            height: 55px;

            border: 1px solid var(--green);

            background:
                linear-gradient(
                    90deg,
                    rgba(0,255,136,0.12),
                    rgba(0,255,136,0.04)
                );

            color: var(--green);

            cursor: pointer;

            font-family: "Orbitron", sans-serif;
            font-size: 13px;
            font-weight: 700;

            letter-spacing: 2px;

            overflow: hidden;

            transition: 0.25s ease;
        }

        .login-btn::before {
            content: "";

            position: absolute;
            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.12),
                transparent
            );

            transition: 0.5s;
        }

        .login-btn:hover {
            color: #00150c;

            background: var(--green);

            box-shadow:
                0 0 20px rgba(0,255,136,0.25),
                0 0 50px rgba(0,255,136,0.08);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        /* ==============================
           STATUS
        ============================== */

        .status {
            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;

            color: var(--muted);
        }

        .status.success {
            color: var(--green);
        }

        .status.error {
            color: var(--red);
        }

        .status.info {
            color: var(--cyan);
        }

        .signup-link {
            margin-top: 24px;

            text-align: center;

            color: #647e76;

            font-size: 14px;
        }

        .signup-link a {
            color: var(--green);
            text-decoration: none;

            font-weight: 700;

            letter-spacing: 1px;
        }

        .signup-link a:hover {
            text-shadow: 0 0 10px var(--green);
        }

        /* ==============================
           FOOTER
        ============================== */

        .footer {
            margin-top: 20px;

            text-align: center;

            color: #3e554e;

            font-family: monospace;
            font-size: 9px;
            letter-spacing: 1.5px;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 520px) {
            nav {
                padding: 0 20px;
            }

            .nav-status {
                display: none;
            }

            main {
                padding: 30px 15px;
            }

            .login-card {
                padding: 23px 18px;
            }

            .title {
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html" class="brand">
            <div class="brand-icon">C3</div>
            CR<span>3</span>CKA
        </a>

        <div class="nav-status">
            <span class="status-dot"></span>
            AUTH NODE ONLINE
        </div>
    </nav>


    <!-- MAIN -->
    <main>

        <section class="login-wrapper">

            <div class="terminal-line">
                SECURE ACCESS CHANNEL
            </div>

            <h1 class="title">
                CR<span>3</span>CKA
            </h1>

            <p class="subtitle">
                IDENTITY AUTHENTICATION GATEWAY
            </p>


            <div class="login-card">

                <div class="security-banner">
                    <strong>● SECURE NODE</strong>
                    <span class="security-code">
                        AES // TLS // AUTH
                    </span>
                </div>


                <!-- GOOGLE -->
                <button
                    type="button"
                    class="google-btn"
                    id="google-login"
                >
                    <span class="google-icon">G</span>
                    CONTINUE WITH GOOGLE
                </button>


                <div class="divider">
                    OR AUTHENTICATE MANUALLY
                </div>


                <!-- LOGIN FORM -->
                <form id="login-form" autocomplete="on">

                    <!-- USERNAME / EMAIL -->
                    <div class="field">

                        <div class="field-label">
                            <label for="login-identity">
                                IDENTITY
                            </label>

                            <span>
                                REQUIRED
                            </span>
                        </div>

                        <div class="input-wrap">

                            <span class="input-icon">
                                &gt;_
                            </span>

                            <input
                                type="text"
                                id="login-identity"
                                name="identity"
                                placeholder="username or email"
                                autocomplete="username"
                                maxlength="120"
                                required
                            >

                        </div>
                    </div>


                    <!-- PASSWORD -->
                    <div class="field">

                        <div class="field-label">
                            <label for="login-password">
                                ACCESS KEY
                            </label>

                            <span>
                                REQUIRED
                            </span>
                        </div>

                        <div class="input-wrap">

                            <span class="input-icon">
                                **
                            </span>

                            <input
                                type="password"
                                id="login-password"
                                name="password"
                                placeholder="enter secure password"
                                autocomplete="current-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggle-login-password"
                            >
                                SHOW
                            </button>

                        </div>
                    </div>


                    <!-- OPTIONS -->
                    <div class="options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="login-remember"
                                name="remember"
                            >

                            KEEP SESSION ACTIVE

                        </label>


                        <a
                            href="forgot-password.html"
                            class="forgot"
                            id="forgot-password"
                        >
                            FORGOT ACCESS?
                        </a>

                    </div>


                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        class="login-btn"
                        id="login-submit"
                    >
                        INITIALIZE SECURE SESSION
                    </button>


                    <!-- STATUS -->
                    <div
                        class="status"
                        id="login-status"
                        aria-live="polite"
                    ></div>

                </form>


                <div class="signup-link">
                    NEW TO THE NETWORK?
                    <a href="signup.html">
                        CREATE IDENTITY →
                    </a>
                </div>

            </div>


            <div class="footer">
                CR3CKA SECURITY // AUTHENTICATION SYSTEM // v1.0
            </div>

        </section>

    </main>


    <script src="./login.js"></script>

</body>
</html>
