<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CR3CKA // Create Identity</title>
<meta name="description" content="CR3CKA Security identity registration portal">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
    --bg: #030609;
    --panel: rgba(7, 13, 19, .86);
    --panel2: rgba(10, 20, 28, .72);
    --green: #00ff88;
    --cyan: #00d9ff;
    --blue: #367bf0;
    --red: #ff416c;
    --text: #eafff6;
    --muted: #78919d;
    --border: rgba(0, 255, 136, .18);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 0%, rgba(0,255,136,.08), transparent 32%),
        radial-gradient(circle at 10% 90%, rgba(0,217,255,.06), transparent 30%),
        #030609;
    color: var(--text);
    font-family: Inter, sans-serif;
    overflow-x: hidden;
}

/* GRID */

.cyber-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .15;
    background-image:
        linear-gradient(rgba(0,255,136,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,.08) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

/* SCANLINES */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: .035;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        #00ff88 4px
    );
}

/* GLOW ORBS */

.auth-orb {
    position: fixed;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    opacity: .12;
}

.o1 {
    background: var(--green);
    top: -100px;
    left: -80px;
}

.o2 {
    background: var(--cyan);
    right: -100px;
    bottom: -100px;
}

/* NAVBAR */

.navbar {
    height: 76px;
    border-bottom: 1px solid rgba(0,255,136,.13);
    background: rgba(2,6,10,.78);
    backdrop-filter: blur(18px);
    position: relative;
    z-index: 10;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

.nav-inner {
    height: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
    color: white;
}

.logo-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--green);
    border-radius: 8px;
    color: var(--green);
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 19px;
    box-shadow:
        0 0 12px rgba(0,255,136,.25),
        inset 0 0 15px rgba(0,255,136,.08);
}

.logo-text {
    font-family: "JetBrains Mono", monospace;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
}

.logo-text span {
    color: var(--green);
}

/* NAV BUTTONS */

.nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn {
    border: 0;
    cursor: pointer;
    text-decoration: none;
    font-family: "JetBrains Mono", monospace;
}

.btn-ghost {
    color: #b6c8d0;
    border: 1px solid rgba(255,255,255,.12);
    padding: 10px 15px;
    border-radius: 7px;
    background: rgba(255,255,255,.025);
    transition: .2s;
}

.btn-ghost:hover {
    color: var(--green);
    border-color: var(--green);
}

.theme-toggle {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(0,255,136,.15);
    border-radius: 7px;
    background: rgba(0,255,136,.035);
    cursor: pointer;
}

/* PAGE */

.auth-page {
    min-height: calc(100vh - 76px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 15px;
    position: relative;
    z-index: 2;
}

/* CARD */

.auth-card {
    width: 100%;
    max-width: 510px;
    position: relative;
    border: 1px solid rgba(0,255,136,.18);
    border-radius: 18px;
    padding: 34px;
    background:
        linear-gradient(
            145deg,
            rgba(8,18,25,.94),
            rgba(3,8,13,.92)
        );
    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        0 0 40px rgba(0,255,136,.035),
        inset 0 0 35px rgba(0,255,136,.018);
    backdrop-filter: blur(20px);
    overflow: hidden;
}

.auth-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--green),
        transparent
    );
    box-shadow: 0 0 18px var(--green);
}

.auth-card::after {
    content: "CR3CKA_SECURE_NODE";
    position: absolute;
    right: 18px;
    top: 15px;
    color: rgba(0,255,136,.22);
    font: 9px "JetBrains Mono", monospace;
    letter-spacing: 1px;
}

/* HEADER */

.auth-head {
    text-align: center;
    margin-bottom: 27px;
}

.auth-head .logo {
    justify-content: center;
    margin-bottom: 19px;
}

.auth-head h1 {
    font-family: "JetBrains Mono", monospace;
    font-size: 27px;
    margin-bottom: 10px;
    letter-spacing: -.7px;
}

.auth-head h1::before {
    content: ">";
    color: var(--green);
    margin-right: 8px;
}

.auth-head p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

/* SYSTEM STATUS */

.system-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
    font: 10px "JetBrains Mono", monospace;
    color: #78919d;
    letter-spacing: 1px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulse 1.4s infinite;
}

@keyframes pulse {
    50% {
        opacity: .35;
        transform: scale(.65);
    }
}

/* GOOGLE */

.google-btn {
    width: 100%;
    min-height: 48px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.045);
    color: #eef5f8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: .22s;
}

.google-btn:hover {
    border-color: rgba(0,255,136,.55);
    background: rgba(0,255,136,.06);
    transform: translateY(-1px);
    box-shadow: 0 0 22px rgba(0,255,136,.08);
}

.google-icon {
    width: 18px;
    height: 18px;
}

/* DIVIDER */

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: #526772;
    font: 10px "JetBrains Mono", monospace;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,.08);
}

/* FORM */

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    color: #a8bdc7;
    font-size: 11px;
    font-family: "JetBrains Mono", monospace;
    margin-bottom: 7px;
}

.input-wrap {
    position: relative;
}

.input-wrap .leading {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #55717c;
}

.input-wrap input {
    width: 100%;
    height: 48px;
    padding: 0 44px;
    border-radius: 8px;
    outline: none;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.28);
    color: #eafff6;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    transition: .2s;
}

.input-wrap input::placeholder {
    color: #415762;
}

.input-wrap input:focus {
    border-color: rgba(0,255,136,.62);
    box-shadow:
        0 0 0 3px rgba(0,255,136,.055),
        0 0 20px rgba(0,255,136,.06);
}

.toggle-visibility {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: #637c86;
    cursor: pointer;
}

.toggle-visibility:hover {
    color: var(--green);
}

/* STRENGTH */

.strength-meter {
    display: flex;
    gap: 5px;
    margin-top: 8px;
}

.strength-meter .seg {
    flex: 1;
    height: 3px;
    background: #16242b;
    border-radius: 5px;
    transition: .25s;
}

.strength-label {
    display: block;
    margin-top: 6px;
    min-height: 14px;
    font: 9px "JetBrains Mono", monospace;
    color: #637c86;
}

/* TERMS */

.auth-row {
    margin: 7px 0;
}

.checkbox-row {
    color: #718993;
    font-size: 11px;
    line-height: 1.6;
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.checkbox-row input {
    accent-color: var(--green);
    margin-top: 3px;
}

.checkbox-row a,
.auth-foot a {
    color: var(--green);
    text-decoration: none;
}

.checkbox-row a:hover,
.auth-foot a:hover {
    text-decoration: underline;
}

/* MAIN BUTTON */

.btn-primary {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 50px;
    border-radius: 8px;
    color: #001108;
    background: var(--green);
    font-weight: 800;
    letter-spacing: .8px;
    box-shadow:
        0 0 20px rgba(0,255,136,.15),
        inset 0 -3px 0 rgba(0,0,0,.12);
    transition: .2s;
}

.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow:
        0 0 30px rgba(0,255,136,.28),
        0 0 70px rgba(0,255,136,.08);
}

.btn-primary::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
    );
    transform: skewX(-20deg);
    transition: .6s;
}

.btn-primary:hover::after {
    left: 130%;
}

.btn-spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,0,0,.2);
    border-top-color: #001108;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

.loading .btn-label {
    display: none;
}

.loading .btn-spinner {
    display: inline-block;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* STATUS */

.form-status {
    min-height: 18px;
    margin-top: 12px;
    text-align: center;
    font: 10px "JetBrains Mono", monospace;
}

.form-status.success {
    color: var(--green);
}

.form-status.error {
    color: var(--red);
}

.field-error {
    display: block;
    color: var(--red);
    font: 9px "JetBrains Mono", monospace;
    margin-top: 5px;
    min-height: 12px;
}

/* FOOTER */

.auth-foot {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.07);
    text-align: center;
    color: #637b85;
    font-size: 11px;
}

/* RESPONSIVE */

@media(max-width:600px) {
    .auth-card {
        padding: 27px 20px;
        border-radius: 14px;
    }

    .logo-text {
        font-size: 14px;
    }

    .btn-ghost {
        display: none;
    }

    .auth-head h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="cyber-grid"></div>
<div class="auth-orb o1"></div>
<div class="auth-orb o2"></div>

<header class="navbar">
    <div class="container nav-inner">

        <a href="index.html" class="logo">
            <span class="logo-mark">C</span>
            <span class="logo-text">
                CR3CKA<span>_</span>SEC
            </span>
        </a>

        <div class="nav-actions">
            <button
                class="theme-toggle"
                id="theme-toggle"

            </button>

            <a href="index.html" class="btn btn-ghost">
                ← HOME
            </a>
        </div>

    </div>
</header>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-head">

            <div class="logo">
                <span class="logo-mark">C</span>
            </div>

            <h1>CREATE IDENTITY</h1>

            <p>
                Initialize your CR3CKA security identity

        </div>

        <div class="system-status">

        </div>

        <!-- GOOGLE SIGNUP -->

        <button

                <path fill="#34A853"
                    d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.87-3c-1.07.72-2.43 1.15-4.08 1.15-3.14 0-5.8-2.12-6.75-4.97H1.25v3.09A12 12 0 0012 24z"/>
                <path fill="#FBBC05"
                    d="M5.25 14.27A7.22 7.22 0 014.87 12c0-.79.14-1.55.38-2.27V6.64H1.25A12 12 0 000 12c0 1.93.46 3.76 1.25 5.36l4-3.09z"/>
                <path fill="#EA4335"
                    d="M12 4.76c1.76 0 3.34.61 4.59 1.82l3.44-3.44C17.95 1.15 15.24 0 12 0A12 12 0 001.25 6.64l4 3.09C6.2 6.88 8.86 4.76 12 4.76z"/>
            </svg>

            Continue with Google
        </button>

        <div class="divider">
            OR INITIALIZE MANUALLY
        </div>

        <form id="signup-form" novalidate>

            <!-- NAME -->

            <div class="form-group">
                <label for="signup-name">

                </label>

                <div class="input-wrap">

                    <svg class="leading"
                         width="17"
                         height="17"
                         viewBox="0 0 24 24"

                         stroke="currentColor"

                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>

                    <input

            </div>

            <!-- USERNAME -->

            <div class="form-group">

                <label for="signup-username">

                </label>

                <div class="input-wrap">

                    <svg class="leading"
                         width="17"
                         height="17"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">
                        <path d="M4 20l4-16h8l4 16"/>
                        <path d="M8 12h8"/>
                    </svg>

                    <input
                        type="text"
                        id="signup-username"
                        placeholder="cr3cka"
                        autocomplete="username">

                </div>

                <span class="field-error"
                      id="signup-username-error"></span>

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label for="signup-email">
                    EMAIL ADDRESS
                </label>

                <div class="input-wrap">

                         width="17"

            <button

            </div>

        </form>

        <p class="auth-foot">

            Already have an account?

            <a href="login.html">

            </a>

        </p>

    </section>

</main>

<script src="signup.js"></script>
